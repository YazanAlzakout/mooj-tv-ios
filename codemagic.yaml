# Manual signed build. Add the new com.moojtv.ios app in Apple Developer and
# App Store Connect, then configure the integration and environment group below.
workflows:
  mooj-tv-ios:
    name: Mooj TV independent iPhone app
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: mooj_tv_ios
    environment:
      node: 24
      xcode: latest
      cocoapods: default
      groups: [mooj_tv_ios]
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.moojtv.ios
      vars:
        CI: "1"
    scripts:
      - name: Validate
        script: |
          set -e
          npm ci
          npm run verify:ios
          npm run test:playback
          npm run typecheck
      - name: Allocate build number and generate project
        script: |
          set -eu
          : "${APP_STORE_APPLE_ID:?Set the NEW app Apple ID in the mooj_tv_ios environment group}"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          case "$LATEST" in ''|*[!0-9]*) echo 'Could not determine latest TestFlight build'; exit 1;; esac
          export IOS_BUILD_NUMBER=$((LATEST + 1))
          npx expo prebuild --platform ios --clean
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          echo "XCODE_WORKSPACE=$WORKSPACE" >> "$CM_ENV"
          echo "XCODE_SCHEME=$(basename "$WORKSPACE" .xcworkspace)" >> "$CM_ENV"
      - name: Sign and build IPA
        script: |
          set -e
          xcode-project use-profiles
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
# No publishing step: inspect the IPA and approve TestFlight distribution first.
